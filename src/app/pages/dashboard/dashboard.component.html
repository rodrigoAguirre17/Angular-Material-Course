<div class="contenedor-productos">
  <div class="card-producto" *ngFor="let producto of productos">
    
    <img [src]="producto.imagen" [alt]="producto.nombre">

    <h3>{{ producto.nombre }}</h3>

    <p class="fecha">📆{{ producto.fecha }}</p>

    <button>
      ♥️
    </button>

  </div>
</div>
